<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>🔊 Read Aloud</h1>
  </header>

  <main>
    <textarea id="text" placeholder="Type or paste text here, or click “Use page selection”…"></textarea>
    <button id="grab" class="link-btn" type="button">Use page selection</button>

    <div class="row">
      <label for="voice">Voice</label>
      <select id="voice"></select>
    </div>

    <div class="row">
      <label for="rate">Speed <span id="rateVal">1.0×</span></label>
      <input type="range" id="rate" min="0.5" max="3" step="0.1" value="1" />
    </div>

    <div class="row">
      <label for="pitch">Pitch <span id="pitchVal">1.0</span></label>
      <input type="range" id="pitch" min="0" max="2" step="0.1" value="1" />
    </div>

    <div class="row">
      <label for="volume">Volume <span id="volumeVal">100%</span></label>
      <input type="range" id="volume" min="0" max="1" step="0.05" value="1" />
    </div>

    <div class="row">
      <label for="hfToken">Hugging Face token <span>for VoxCPM2</span></label>
      <input type="password" id="hfToken" placeholder="hf_…" autocomplete="off" spellcheck="false" />
    </div>

    <div class="controls">
      <button id="speak" class="primary" type="button">▶ Speak</button>
      <button id="pause" type="button" disabled>⏸ Pause</button>
      <button id="stop" type="button" disabled>⏹ Stop</button>
    </div>

    <p class="hint">Tip: select text on any page, then right-click → “Read aloud”, or press <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd>.</p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
